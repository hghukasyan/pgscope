<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PGScope logo">
  <title>PGScope</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- Scope ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#g)" stroke-width="6"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#1E3A5F" stroke-width="2" opacity="0.9"/>
  <!-- Database cylinder (geometric, not elephant) -->
  <ellipse cx="64" cy="48" rx="22" ry="8" fill="#0B1220" stroke="#60A5FA" stroke-width="3"/>
  <path d="M42 48 v28 c0 6 10 10 22 10 s22-4 22-10 V48"
        fill="none" stroke="#60A5FA" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="64" cy="62" rx="22" ry="7" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.85"/>
  <ellipse cx="64" cy="76" rx="22" ry="7" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.55"/>
  <!-- Magnifier handle -->
  <line x1="94" y1="94" x2="112" y2="112" stroke="#14B8A6" stroke-width="7" stroke-linecap="round"/>
</svg>
